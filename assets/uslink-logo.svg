<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="usLinkGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111622" />
      <stop offset="100%" stop-color="#080a0f" />
    </linearGradient>
    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#00e676" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Shield Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Outer Glowing Hexagonal Node Track -->
  <polygon points="256,64 424,160 424,352 256,448 88,352 88,160" 
           fill="none" 
           stroke="url(#usLinkGlow)" 
           stroke-width="12" 
           stroke-dasharray="16 10" 
           opacity="0.35" />

  <!-- Central Interlocking Dual Chain Links forming 'US' Core -->
  <g filter="url(#neonShadow)">
    <!-- Left Link (representing 'U') -->
    <path d="M196,160 L160,160 C124,160 96,188 96,224 L96,288 C96,324 124,352 160,352 L196,352" 
          fill="none" 
          stroke="url(#usLinkGlow)" 
          stroke-width="32" 
          stroke-linecap="round" />

    <!-- Right Link (representing 'S / Link') -->
    <path d="M316,352 L352,352 C388,352 416,324 416,288 L416,224 C416,188 388,160 352,160 L316,160" 
          fill="none" 
          stroke="url(#usLinkGlow)" 
          stroke-width="32" 
          stroke-linecap="round" />

    <!-- Interlocking Center Connection Nodes -->
    <rect x="180" y="232" width="152" height="48" rx="24" fill="#080a0f" stroke="url(#usLinkGlow)" stroke-width="14" />
    <circle cx="256" cy="256" r="14" fill="#00e676" />
  </g>

  <!-- Upper Node Satellites -->
  <circle cx="256" cy="116" r="10" fill="#00e5ff" />
  <circle cx="390" cy="192" r="8" fill="#00e676" />
  <circle cx="122" cy="320" r="8" fill="#00e5ff" />
</svg>
