<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — US - Link</title>
  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/auth.css">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#08090D">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .password-wrapper {
      position: relative;
    }
    .password-wrapper .form-control {
      padding-right: 48px;
    }
    .eye-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      transition: color 0.2s;
    }
    .eye-btn:hover { color: var(--text-secondary); }
    .eye-btn svg { width: 20px; height: 20px; }
  </style>
</head>
<body>
  <!-- Dynamic Ambient Animated Background -->
  <div class="auth-bg-canvas">
    <div class="auth-orb auth-orb-1"></div>
    <div class="auth-orb auth-orb-2"></div>
    <div class="auth-orb auth-orb-3"></div>
  </div>

  <div id="app-container" style="background:transparent; position:relative; z-index:1;">
    <div id="toast-container"></div>
    <div id="spinner-overlay" class="spinner-overlay">
      <div class="spinner"></div>
    </div>

    <div class="auth-wrapper">
      <div class="auth-header">
        <div class="auth-brand-top">
          <span class="brand-text">US-LINK</span>
        </div>
        <div class="auth-logo-badge">
          <img src="./assets/uslink-logo.svg" alt="US Link">
        </div>
        <h1 class="auth-logo">Sign In</h1>
        <p class="auth-subtitle">Access your account and live payouts</p>
      </div>

      <div class="auth-card">
        <!-- Auth Method Selector Tabs -->
        <div class="auth-toggle-tabs">
          <button type="button" class="auth-tab-btn active" id="tab-btn-phone" onclick="switchLoginMethod('phone')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            <span>Phone</span>
          </button>
          <button type="button" class="auth-tab-btn" id="tab-btn-email" onclick="switchLoginMethod('email')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <span>Email / Gmail</span>
          </button>
        </div>

        <form id="login-form">
          <!-- Phone Field -->
          <div id="login-phone-field" class="form-group">
            <label class="form-label" for="login-phone">Phone Number</label>
            <div class="country-select-container">
              <div class="country-select-wrap">
                <select id="country-code-select" class="form-control" onchange="onLoginCountryChange(this.value)">
                  <option value="+1" data-placeholder="(555) 000-0000" selected>US (+1)</option>
                  <option value="+880" data-placeholder="017XXXXXXXX">BD (+880)</option>
                  <option value="+44" data-placeholder="7911 123456">UK (+44)</option>
                  <option value="+1" data-placeholder="(555) 000-0000">CA (+1)</option>
                  <option value="+971" data-placeholder="50 123 4567">UAE (+971)</option>
                  <option value="+966" data-placeholder="50 123 4567">KSA (+966)</option>
                  <option value="+91" data-placeholder="98765 43210">IN (+91)</option>
                  <option value="+92" data-placeholder="300 1234567">PK (+92)</option>
                  <option value="+60" data-placeholder="12 345 6789">MY (+60)</option>
                  <option value="+65" data-placeholder="8123 4567">SG (+65)</option>
                  <option value="+61" data-placeholder="412 345 678">AU (+61)</option>
                  <option value="+49" data-placeholder="151 23456789">DE (+49)</option>
                  <option value="+33" data-placeholder="6 12 34 56 78">FR (+33)</option>
                  <option value="+39" data-placeholder="312 345 6789">IT (+39)</option>
                  <option value="+34" data-placeholder="612 34 56 78">ES (+34)</option>
                  <option value="+234" data-placeholder="802 123 4567">NG (+234)</option>
                  <option value="+63" data-placeholder="917 123 4567">PH (+63)</option>
                  <option value="+55" data-placeholder="11 91234-5678">BR (+55)</option>
                  <option value="+27" data-placeholder="71 234 5678">ZA (+27)</option>
                  <option value="+90" data-placeholder="532 123 45 67">TR (+90)</option>
                  <option value="+81" data-placeholder="90 1234 5678">JP (+81)</option>
                  <option value="+82" data-placeholder="10 1234 5678">KR (+82)</option>
                </select>
                <div class="country-select-arrow">▼</div>
              </div>
              <input class="form-control" type="tel" id="login-phone" placeholder="(555) 000-0000" oninput="onLoginPhoneInput(this.value)">
            </div>
          </div>

          <!-- Email Field -->
          <div id="login-email-field" class="form-group" style="display:none;">
            <label class="form-label" for="login-email">Email Address / Gmail</label>
            <div class="input-with-icon-wrap">
              <input class="form-control has-icon" type="email" id="login-email" placeholder="name@gmail.com">
              <span class="input-leading-icon">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              </span>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <div class="password-wrapper input-with-icon-wrap">
              <input class="form-control has-icon" type="password" id="login-password" required placeholder="••••••••" style="padding-right:48px !important;">
              <span class="input-leading-icon">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              <button type="button" class="eye-btn" id="toggle-login-pass" aria-label="Show/hide password">
                <svg id="eye-icon-login" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="auth-btn">Sign In</button>
        </form>

        <div class="auth-footer">
          Don't have an account? <a class="auth-link" href="./register.html">Create Account</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabase.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/pwa-install.js"></script>
  <script>
    // ─── Switch between Phone & Email Login ──────────────────────────────────
    let currentLoginMethod = 'phone';

    function switchLoginMethod(method) {
      currentLoginMethod = method;
      const phoneBtn = document.getElementById('tab-btn-phone');
      const emailBtn = document.getElementById('tab-btn-email');
      const phoneField = document.getElementById('login-phone-field');
      const emailField = document.getElementById('login-email-field');

      if (method === 'phone') {
        phoneBtn.classList.add('active');
        emailBtn.classList.remove('active');
        phoneField.style.display = 'block';
        emailField.style.display = 'none';
      } else {
        emailBtn.classList.add('active');
        phoneBtn.classList.remove('active');
        phoneField.style.display = 'none';
        emailField.style.display = 'block';
      }
    }

    function onLoginCountryChange() {
      const select = document.getElementById('country-code-select');
      const phoneInput = document.getElementById('login-phone');
      const opt = select.options[select.selectedIndex];
      if (opt && phoneInput) {
        phoneInput.placeholder = opt.getAttribute('data-placeholder') || 'Phone Number';
      }
    }

    // ─── Smart Auto Country Detection on Input (Login) ─────────────────────
    function onLoginPhoneInput(val) {
      if (!val) return;
      const clean = val.trim();
      const digits = clean.replace(/[^0-9]/g, '');
      const select = document.getElementById('country-code-select');
      if (!select) return;

      let detectedCode = null;

      // Bangladesh: 01 (017, 018, 019, 013, 014, 015, 016) or +880 or 880
      if (clean.startsWith('01') || clean.startsWith('+880') || digits.startsWith('880')) {
        detectedCode = '+880';
      }
      // UK: +44 or 44
      else if (clean.startsWith('+44') || (digits.startsWith('44') && digits.length >= 3)) {
        detectedCode = '+44';
      }
      // UAE: +971 or 971
      else if (clean.startsWith('+971') || digits.startsWith('971')) {
        detectedCode = '+971';
      }
      // Saudi Arabia: +966 or 966
      else if (clean.startsWith('+966') || digits.startsWith('966')) {
        detectedCode = '+966';
      }
      // India: +91 or 91
      else if (clean.startsWith('+91') || (digits.startsWith('91') && digits.length >= 3)) {
        detectedCode = '+91';
      }
      // Pakistan: +92 or 92
      else if (clean.startsWith('+92') || (digits.startsWith('92') && digits.length >= 3)) {
        detectedCode = '+92';
      }
      // USA / Canada: starts with +1, or 12... 1...
      else if (clean.startsWith('+1') || clean.startsWith('1')) {
        detectedCode = '+1';
      }

      if (detectedCode && select.value !== detectedCode) {
        select.value = detectedCode;
        onLoginCountryChange();
      }
    }

    // Eye icon toggle for password visibility
    const toggleBtn = document.getElementById('toggle-login-pass');
    const passInput = document.getElementById('login-password');
    const eyeIcon  = document.getElementById('eye-icon-login');

    const eyeOpenSVG = `
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
      <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>`;
    const eyeClosedSVG = `
      <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>`;

    toggleBtn.addEventListener('click', () => {
      const isHidden = passInput.type === 'password';
      passInput.type = isHidden ? 'text' : 'password';
      eyeIcon.innerHTML = isHidden ? eyeClosedSVG : eyeOpenSVG;
    });

    // Login form submit
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('login-password').value;

      if (!password) {
        showToast('Please enter your password', 'error');
        return;
      }

      let primaryEmail = '';
      let fallbackEmail = '';
      let savedPhone = '';

      if (currentLoginMethod === 'phone') {
        const countryCode = document.getElementById('country-code-select').value;
        const rawPhone = document.getElementById('login-phone').value.trim();
        const cleanDigits = rawPhone.replace(/[^0-9]/g, '');

        if (!cleanDigits) {
          showToast('Please enter your phone number', 'error');
          return;
        }

        let normalizedNumber = cleanDigits;
        if (countryCode === '+880' && normalizedNumber.startsWith('0')) {
          normalizedNumber = normalizedNumber.substring(1);
        }

        primaryEmail = `${countryCode.replace('+', '')}${normalizedNumber}@us-link.app`;
        fallbackEmail = `${cleanDigits}@us-link.app`; // For legacy registered numbers
        savedPhone = `${countryCode}${normalizedNumber}`;
      } else {
        const rawEmail = document.getElementById('login-email').value.trim().toLowerCase();
        if (!rawEmail) {
          showToast('Please enter your email address', 'error');
          return;
        }
        primaryEmail = rawEmail;
        savedPhone = rawEmail;
      }

      showSpinner(true);
      try {
        let authData = null;
        let authError = null;

        // Try primary auth email
        const res1 = await supabaseClient.auth.signInWithPassword({ email: primaryEmail, password });
        if (res1.error && fallbackEmail && fallbackEmail !== primaryEmail) {
          // Try legacy fallback
          const res2 = await supabaseClient.auth.signInWithPassword({ email: fallbackEmail, password });
          authData = res2.data;
          authError = res2.error;
        } else {
          authData = res1.data;
          authError = res1.error;
        }

        if (authError) throw authError;
        const data = authData;

        if (savedPhone) {
          localStorage.setItem('user_phone', savedPhone);
        }

        showToast('Login successful!', 'success');

        // Check if user profile is suspended or active
        const { data: profile } = await supabaseClient
          .from('profiles')
          .select('status')
          .eq('id', data.user.id)
          .single();

        if (profile && profile.status === 'suspended') {
          await supabaseClient.auth.signOut();
          throw new Error('Your account has been suspended by administration.');
        }

        // Check if admin
        const { data: isAdmin } = await supabaseClient
          .from('admin_users')
          .select('role')
          .eq('id', data.user.id)
          .maybeSingle();

        setTimeout(() => {
          window.location.href = isAdmin ? './admin/index.html' : './app.html';
        }, 800);

      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        showSpinner(false);
      }
    });

    function showSpinner(show) {
      document.getElementById('spinner-overlay').classList.toggle('active', show);
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerText = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.animation = 'none';
        toast.offsetHeight;
        toast.style.animation = 'toast-in 0.2s reverse forwards';
        setTimeout(() => toast.remove(), 200);
      }, 3000);
    }
  </script>
</body>
</html>
