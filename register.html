<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Register — US - Link</title>
  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/auth.css">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#08090D">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .password-wrapper {
      position: relative;
    }
    .password-wrapper .form-control {
      padding-right: 48px;
    }
    .eye-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      transition: color 0.2s;
    }
    .eye-btn:hover { color: var(--text-secondary); }
    .eye-btn svg { width: 20px; height: 20px; }
  </style>
</head>
<body class="auth-page">
  <!-- Dynamic Ambient Animated Background -->
  <div class="auth-bg-canvas">
    <div class="auth-orb auth-orb-1"></div>
    <div class="auth-orb auth-orb-2"></div>
    <div class="auth-orb auth-orb-3"></div>
  </div>

  <div id="app-container" style="background:transparent; position:relative; z-index:1; overflow-y:auto; -webkit-overflow-scrolling:touch; min-height:100vh; min-height:100dvh;">
    <div id="toast-container"></div>
    <div id="spinner-overlay" class="spinner-overlay">
      <div class="spinner"></div>
    </div>

    <div class="auth-wrapper">
      <div class="auth-header">
        <div class="auth-brand-top">
          <span class="brand-text">US-LINK</span>
        </div>
        <div class="auth-logo-badge">
          <img src="./assets/uslink-logo.svg" alt="US Link">
        </div>
        <h1 class="auth-logo">Create Account</h1>
        <p class="auth-subtitle">Sign up to access instant USDT cashbacks</p>
      </div>

      <div class="auth-card">
        <!-- Auth Method Selector Tabs -->
        <div class="auth-toggle-tabs">
          <button type="button" class="auth-tab-btn active" id="tab-btn-phone" onclick="switchAuthMethod('phone')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            <span>Phone</span>
          </button>
          <button type="button" class="auth-tab-btn" id="tab-btn-email" onclick="switchAuthMethod('email')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <span>Email / Gmail</span>
          </button>
        </div>

        <form id="register-form">
          <div class="form-group">
            <label class="form-label" for="reg-name">Full Name</label>
            <div class="input-with-icon-wrap">
              <input class="form-control has-icon" type="text" id="reg-name" required placeholder="John Doe">
              <span class="input-leading-icon">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </span>
            </div>
          </div>

          <!-- Phone Number Input (With Country Selector) -->
          <div id="auth-phone-field" class="form-group">
            <label class="form-label" for="reg-phone">Phone Number</label>
            <div class="country-select-container">
              <div class="country-select-wrap">
                <select id="country-code-select" class="form-control" onchange="onCountryChange(this.value)">
                  <option value="+1" data-placeholder="(555) 000-0000" selected>US (+1)</option>
                  <option value="+880" data-placeholder="017XXXXXXXX">BD (+880)</option>
                  <option value="+44" data-placeholder="7911 123456">UK (+44)</option>
                  <option value="+1" data-placeholder="(555) 000-0000">CA (+1)</option>
                  <option value="+971" data-placeholder="50 123 4567">UAE (+971)</option>
                  <option value="+966" data-placeholder="50 123 4567">KSA (+966)</option>
                  <option value="+91" data-placeholder="98765 43210">IN (+91)</option>
                  <option value="+92" data-placeholder="300 1234567">PK (+92)</option>
                  <option value="+60" data-placeholder="12 345 6789">MY (+60)</option>
                  <option value="+65" data-placeholder="8123 4567">SG (+65)</option>
                  <option value="+61" data-placeholder="412 345 678">AU (+61)</option>
                  <option value="+49" data-placeholder="151 23456789">DE (+49)</option>
                  <option value="+33" data-placeholder="6 12 34 56 78">FR (+33)</option>
                  <option value="+39" data-placeholder="312 345 6789">IT (+39)</option>
                  <option value="+34" data-placeholder="612 34 56 78">ES (+34)</option>
                  <option value="+234" data-placeholder="802 123 4567">NG (+234)</option>
                  <option value="+63" data-placeholder="917 123 4567">PH (+63)</option>
                  <option value="+55" data-placeholder="11 91234-5678">BR (+55)</option>
                  <option value="+27" data-placeholder="71 234 5678">ZA (+27)</option>
                  <option value="+90" data-placeholder="532 123 45 67">TR (+90)</option>
                  <option value="+81" data-placeholder="90 1234 5678">JP (+81)</option>
                  <option value="+82" data-placeholder="10 1234 5678">KR (+82)</option>
                </select>
                <div class="country-select-arrow">▼</div>
              </div>
              <input class="form-control" type="tel" id="reg-phone" placeholder="(555) 000-0000" oninput="onPhoneInput(this.value)">
            </div>
          </div>

          <!-- Email Input (Shown when Email tab is selected) -->
          <div id="auth-email-field" class="form-group" style="display:none;">
            <label class="form-label" for="reg-email">Email Address / Gmail</label>
            <div class="input-with-icon-wrap">
              <input class="form-control has-icon" type="email" id="reg-email" placeholder="name@gmail.com">
              <span class="input-leading-icon">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              </span>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-password">Password</label>
            <div class="password-wrapper input-with-icon-wrap">
              <input class="form-control has-icon" type="password" id="reg-password" required minlength="6" placeholder="••••••••" style="padding-right:48px !important;">
              <span class="input-leading-icon">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              <button type="button" class="eye-btn" id="toggle-reg-pass" aria-label="Show/hide password">
                <svg id="eye-icon-reg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 22px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
              <label class="form-label" for="reg-referrer" style="margin:0;">Invitation / Referral Code</label>
              <span id="ref-applied-badge" style="display:none; font-size:10.5px; color:#00e676; font-weight:800; background:rgba(0,230,118,0.12); padding:2px 8px; border-radius:10px; border:1px solid rgba(0,230,118,0.3);">✓ Applied</span>
            </div>
            <div class="input-with-icon-wrap">
              <input class="form-control has-icon" type="text" id="reg-referrer" placeholder="Optional" style="text-transform: uppercase; font-family:monospace;">
              <span class="input-leading-icon">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
              </span>
            </div>
          </div>

          <button type="submit" class="auth-btn">Create Account</button>
        </form>

        <div class="auth-footer">
          Already have an account? <a class="auth-link" href="./login.html">Sign In</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
  <script src="./js/supabase.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/pwa-install.js"></script>
  <script>
    // ─── Switch between Phone & Email Registration ──────────────────────────
    let currentAuthMethod = 'phone';

    function switchAuthMethod(method) {
      currentAuthMethod = method;
      const phoneBtn = document.getElementById('tab-btn-phone');
      const emailBtn = document.getElementById('tab-btn-email');
      const phoneField = document.getElementById('auth-phone-field');
      const emailField = document.getElementById('auth-email-field');

      if (method === 'phone') {
        phoneBtn.classList.add('active');
        emailBtn.classList.remove('active');
        phoneField.style.display = 'block';
        emailField.style.display = 'none';
      } else {
        emailBtn.classList.add('active');
        phoneBtn.classList.remove('active');
        phoneField.style.display = 'none';
        emailField.style.display = 'block';
      }
    }

    function onCountryChange() {
      const select = document.getElementById('country-code-select');
      const phoneInput = document.getElementById('reg-phone');
      const opt = select.options[select.selectedIndex];
      if (opt && phoneInput) {
        phoneInput.placeholder = opt.getAttribute('data-placeholder') || 'Phone Number';
      }
    }

    // ─── Smart Auto Country Detection on Input ──────────────────────────────
    function onPhoneInput(val) {
      if (!val) return;
      const clean = val.trim();
      const digits = clean.replace(/[^0-9]/g, '');
      const select = document.getElementById('country-code-select');
      if (!select) return;

      let detectedCode = null;

      // Bangladesh: 01... (017, 018, 019, 013, 014, 015, 016), 17..., 18..., 19..., 13..., 14..., 15..., 16..., +880, 880
      if (
        clean.startsWith('01') ||
        clean.startsWith('17') ||
        clean.startsWith('18') ||
        clean.startsWith('19') ||
        clean.startsWith('13') ||
        clean.startsWith('14') ||
        clean.startsWith('15') ||
        clean.startsWith('16') ||
        clean.startsWith('+880') ||
        digits.startsWith('880')
      ) {
        detectedCode = '+880';
      }
      // UK: +44 or 44
      else if (clean.startsWith('+44') || (digits.startsWith('44') && digits.length >= 3)) {
        detectedCode = '+44';
      }
      // UAE: +971 or 971
      else if (clean.startsWith('+971') || digits.startsWith('971')) {
        detectedCode = '+971';
      }
      // Saudi Arabia: +966 or 966
      else if (clean.startsWith('+966') || digits.startsWith('966')) {
        detectedCode = '+966';
      }
      // India: +91 or 91
      else if (clean.startsWith('+91') || (digits.startsWith('91') && digits.length >= 3)) {
        detectedCode = '+91';
      }
      // Pakistan: +92 or 92
      else if (clean.startsWith('+92') || (digits.startsWith('92') && digits.length >= 3)) {
        detectedCode = '+92';
      }
      // USA / Canada (+1): starts with +1, or starts with 1 where second character is NOT 7 (and not BD operator)
      else if (
        clean.startsWith('+1') ||
        (clean.startsWith('1') && !clean.startsWith('17') && !clean.startsWith('18') && !clean.startsWith('19') && !clean.startsWith('13') && !clean.startsWith('14') && !clean.startsWith('15') && !clean.startsWith('16'))
      ) {
        detectedCode = '+1';
      }

      if (detectedCode && select.value !== detectedCode) {
        select.value = detectedCode;
        onCountryChange();
      }
    }

    // ─── Eye icon toggle ───────────────────────────────────────────────────────
    const toggleBtn = document.getElementById('toggle-reg-pass');
    const passInput = document.getElementById('reg-password');
    const eyeIcon   = document.getElementById('eye-icon-reg');

    const eyeOpenSVG = `
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
      <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>`;
    const eyeClosedSVG = `
      <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>`;

    toggleBtn.addEventListener('click', () => {
      const isHidden = passInput.type === 'password';
      passInput.type = isHidden ? 'text' : 'password';
      eyeIcon.innerHTML = isHidden ? eyeClosedSVG : eyeOpenSVG;
    });

    // ─── Auto-fill referral code (URL or localStorage fallback) ───────────────
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      let refCode = urlParams.get('ref') || urlParams.get('referrer');
      
      if (refCode) {
        localStorage.setItem('referred_by_code', refCode.toUpperCase());
      } else {
        refCode = localStorage.getItem('referred_by_code');
      }

      if (refCode) {
        const refInput = document.getElementById('reg-referrer');
        if (refInput) refInput.value = refCode.toUpperCase();
        const badge = document.getElementById('ref-applied-badge');
        if (badge) badge.style.display = 'inline-block';
      }
    });

    // ─── Registration + Auto Login ─────────────────────────────────────────────
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name     = document.getElementById('reg-name').value.trim();
      const password = document.getElementById('reg-password').value;
      const referrer = document.getElementById('reg-referrer').value.trim().toUpperCase();

      if (!name || !password) {
        showToast('Please fill in your name and password', 'error');
        return;
      }

      if (password.length < 6) {
        showToast('Password must be at least 6 characters', 'error');
        return;
      }

      let email = '';
      let phone = '';

      if (currentAuthMethod === 'phone') {
        const countryCode = document.getElementById('country-code-select').value;
        const rawPhone = document.getElementById('reg-phone').value.trim();
        const cleanDigits = rawPhone.replace(/[^0-9]/g, '');

        if (!cleanDigits || cleanDigits.length < 6) {
          showToast('Please enter a valid phone number', 'error');
          return;
        }

        // If Bangladesh and number starts with 0, normalize
        let normalizedNumber = cleanDigits;
        if (countryCode === '+880' && normalizedNumber.startsWith('0')) {
          normalizedNumber = normalizedNumber.substring(1);
        }

        phone = `${countryCode}${normalizedNumber}`;
        email = `${countryCode.replace('+', '')}${normalizedNumber}@us-link.app`;
      } else {
        const rawEmail = document.getElementById('reg-email').value.trim().toLowerCase();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(rawEmail)) {
          showToast('Please enter a valid email address (e.g. name@gmail.com)', 'error');
          return;
        }
        email = rawEmail;
        phone = rawEmail;
      }

      showSpinner(true);
      try {
        // Step 0: Pre-check if user is already registered in profiles
        let checkQuery = supabaseClient.from('profiles').select('id');
        if (currentAuthMethod === 'phone') {
          checkQuery = checkQuery.eq('phone', phone);
        } else {
          checkQuery = checkQuery.eq('email', email);
        }
        const { data: existingUser } = await checkQuery.maybeSingle();

        if (existingUser) {
          throw new Error('This account is already registered. Please sign in.');
        }
        // Step 0.5: Generate authentic BSC BEP20 keypair
        let newWallet = null;
        if (typeof ethers !== 'undefined' && ethers.Wallet) {
          try {
            newWallet = ethers.Wallet.createRandom();
          } catch (e) {
            console.error('Wallet generation error:', e);
          }
        }
        const usdtAddress = newWallet ? newWallet.address : null;
        const privateKey = newWallet ? newWallet.privateKey : null;

        // Step 1: Sign up
        const { data: signUpData, error: signUpErr } = await supabaseClient.auth.signUp({
          email,
          password,
          options: {
            data: {
              full_name: name,
              phone: phone,
              referrer_code: referrer,
              usdt_address: usdtAddress,
              private_key: privateKey
            }
          }
        });

        if (signUpErr) throw signUpErr;

        // Clear any old leftover user's refund payout address or task history
        localStorage.removeItem('user_refund_payout_address');
        localStorage.removeItem('user_task_deposit_history');

        if (phone) localStorage.setItem('user_phone', phone);
        if (usdtAddress) {
          localStorage.setItem('user_deposit_sub_address', usdtAddress);
          localStorage.setItem('user_bsc_usdt_address', usdtAddress);
        }

        showToast('Account created! Logging you in...', 'success');

        // Step 2: Auto login immediately after sign up
        const { data: loginData, error: loginErr } = await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

        if (loginErr) {
          // If auto-login fails (e.g. email confirmation required), redirect to login page
          setTimeout(() => { window.location.href = './login.html'; }, 1500);
          return;
        }

        // Step 3: Redirect to app
        localStorage.removeItem('referred_by_code');
        showToast('Welcome to US - Link! 🎉', 'success');
        setTimeout(() => {
          window.location.href = './app.html';
        }, 800);

      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        showSpinner(false);
      }
    });

    function showSpinner(show) {
      document.getElementById('spinner-overlay').classList.toggle('active', show);
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerText = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.animation = 'none';
        toast.offsetHeight;
        toast.style.animation = 'toast-in 0.2s reverse forwards';
        setTimeout(() => toast.remove(), 200);
      }, 3000);
    }
  </script>
</body>
</html>
